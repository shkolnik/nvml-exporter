name: Bug report
description: Wrong or missing metrics, a crash, or packaging trouble
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: once
    attributes:
      label: Output of `nvml-exporter once`
      description: >
        One scrape to stdout, including any log lines. Most GPU-specific problems can be
        diagnosed from this alone. Run it with the same config file as the service.
      render: text
    validations:
      required: true
  - type: textarea
    id: env
    attributes:
      label: Environment
      description: GPU model, driver version (`nvidia-smi --query-gpu=name,driver_version --format=csv`), OS, how installed (deb, binary, cargo), exporter version (`nvml-exporter --version`).
      render: text
    validations:
      required: true
  - type: textarea
    id: config
    attributes:
      label: Config file
      description: Replace any address you do not want to share with one from 192.0.2.0/24.
      render: toml
